x-kong-config: &kong-env
  KONG_DATABASE: postgres # Use Postgres as the backing database
  KONG_PG_HOST: postgres # Hostname of the Postgres service
  KONG_PG_DATABASE: ${POSTGRES_DB} # Name of the database to connect to
  KONG_PG_USER: ${POSTGRES_USER} # Database username
  KONG_PG_PASSWORD: ${POSTGRES_PASSWORD} # Database password

services:

  kong-cp:
    image: ghcr.io/ognastack/gateway:main
    build:
      context: ./kong
    container_name: kong-cp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - api
    environment:
      KONG_PLUGINS: bundled,cors,acme,ogna-guard
      KONG_HEADERS: "off"
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_NGINX_HTTP_LUA_SHARED_DICT: acme_storage 10m
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      OGNA_EXTRA_ROUTES: ${OGNA_EXTRA_ROUTES:-}
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "80:8000"
      - "443:8443"
      - "8000:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s # Give Kong time to start
    env_file:
      - .env

  db-init:
    image: ghcr.io/ognastack/migrations:main
    build:
      context: ./migrations
    container_name: db-init
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: init
    restart: on-failure
    networks:
      - database

  gotrue:
    image: bitnamilegacy/gotrue:2.178.0
    platform: linux/amd64
    security_opt:
      - no-new-privileges:true
    environment:
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_MAILER_AUTOCONFIRM: true
      MAILER_AUTOCONFIRM: true
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_JWT_AUD: "authenticated"
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated"
      GOTRUE_SITE_URL: "http://localhost"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=auth"
    expose:
      - "9999"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - api
      - database
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "ps | grep '[g]otrue'"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18.1-alpine
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ogna_user} -d ${POSTGRES_DB:-ogna_db}",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    env_file:
      - .env

  migrations:
    image: ghcr.io/ognastack/migrations:main
    build:
      context: ./migrations
    container_name: migrations
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_TABLE: migrations.schema_migrations
      DBMATE_MIGRATIONS_DIR: "/db/migrations"
      DBMATE_NO_DUMP_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      gotrue:
        condition: service_healthy
    command: up
    restart: on-failure
    networks:
      - database


  storage:
    image: ghcr.io/ognastack/storage:latest
    security_opt:
      - no-new-privileges:true
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      DATABASE_URL: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      STORAGE_TYPE: 'S3'
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GRAPHQL_HOST: 'http://hasura:8080'
      GRAPHQL_ENDPOINT: 'v1/graphql'
      GRAPHQL_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
    volumes:
      - temp_files:/tmp
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      hasura:
        condition: service_started
    networks:
      - storage
      - gql
      - api
    env_file:
      - .env

  dashboard:
    image: ghcr.io/ognastack/ogna-fe-template:latest
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    depends_on:
      kong-cp:
        condition: service_healthy
    networks:
      - api
    env_file:
      - .env

  hasura:
    image: ghcr.io/ognastack/hasura:main
    build:
      context: ./hasura-config
    container_name: hasura
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${HASURA_CONSOLE_PORT:-8080}:8080"
    networks:
      - gql
      - database
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE:-false}
      HASURA_GRAPHQL_METADATA_DIR: /tmp/hasura-metadata
      HASURA_GRAPHQL_JWT_SECRET: >
        {
          "type": "HS256",
          "key": "${GOTRUE_JWT_SECRET}",
          "claims_map": {
            "x-hasura-user-id": { "path": "$.sub" },
            "x-hasura-default-role": { "path": "$.role" },
            "x-hasura-allowed-roles": ["authenticated"]
          }
        }
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully


volumes:
  postgres_data:
    driver: local
  temp_files:
    driver: local

networks:
  storage:
    driver: bridge
  database:
    driver: bridge
  gql:
    driver: bridge
  api:
    driver: bridge
