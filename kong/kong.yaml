_format_version: "3.0"
_transform: true

# Rendered at container start by docker-entrypoint-ogna.sh: placeholders are
# replaced and OGNA_EXTRA_ROUTES services are injected at the end-of-services marker.

services:
  ##################################
  # ZITADEL (identity provider) on its own hostname, OGNA_AUTH_DOMAIN.
  # Host-matched routes win over the host-less OGNA routes below, so
  # everything on the auth domain goes to Zitadel and nothing else does.
  ##################################
  - name: zitadel-api
    url: http://zitadel:8080
    routes:
      - name: zitadel-api-route
        hosts:
          - ${OGNA_AUTH_DOMAIN}
        paths:
          - /
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          second: 50
          minute: 600
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  # Token endpoint: strict per-IP limit (credential guessing, refresh abuse)
  - name: zitadel-token
    url: http://zitadel:8080
    routes:
      - name: zitadel-token-route
        hosts:
          - ${OGNA_AUTH_DOMAIN}
        paths:
          - /oauth/v2/token
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          minute: ${OGNA_AUTH_RATE_LIMIT_MINUTE}
          hour: ${OGNA_AUTH_RATE_LIMIT_HOUR}
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  # Login UI (Next.js)
  - name: zitadel-login
    url: http://zitadel-login:3000
    routes:
      - name: zitadel-login-route
        hosts:
          - ${OGNA_AUTH_DOMAIN}
        paths:
          - /ui/v2/login
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          second: 50
          minute: 600
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  ##################################
  # OGNA services. ogna-guard checks Zitadel tokens and forwards an internal
  # token + X-Authenticated-* headers to the upstream.
  ##################################
  - name: dashboard
    url: http://dashboard:3000
    routes:
      - name: dashboard-route
        paths:
          - /
    plugins:
      - name: ogna-guard
        config:
          require_auth: false

  - name: api-service
    url: http://api:8000
    routes:
      - name: api-service-route
        paths:
          - /api
    plugins:
      - name: ogna-guard
        config:
          require_auth: true
      - name: cors
        config:
          origins: ${OGNA_CORS_ORIGINS}
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type]
          credentials: true
      - name: rate-limiting
        config:
          second: 500
          minute: 1000
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
          size_unit: megabytes

  - name: storage-service
    url: http://storage:8000
    routes:
      - name: storage-service-route
        paths:
          - /storage
    plugins:
      - name: ogna-guard
        config:
          require_auth: true
      - name: cors
        config:
          origins: ${OGNA_CORS_ORIGINS}
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type]
          credentials: true
      - name: rate-limiting
        config:
          second: 500
          minute: 1000
          policy: local
          hide_client_headers: true

  - name: hasura
    url: http://hasura:8080/v1/graphql
    routes:
      - name: hasura-route
        paths:
          - /graphql
    plugins:
      - name: ogna-guard
        config:
          require_auth: true
      - name: cors
        config:
          origins: ${OGNA_CORS_ORIGINS}
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type]
          credentials: true
      - name: rate-limiting
        config:
          second: 200
          minute: 1000
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 5
          size_unit: megabytes

# END SERVICES
