_format_version: "3.0"
_transform: true

############################
# CONSUMERS
############################

consumers:
  - username: ogna-platform
    jwt_secrets:
      - key: authenticated
        secret: ${GOTRUE_JWT_SECRET}
        algorithm: HS256

############################
# SERVICES
############################

services:
  ##################################
  # GoTrue (AUTH)
  ##################################
  - name: gotrue-service
    url: http://gotrue:9999
    routes:
      - name: gotrue-route
        paths:
          - /auth
    plugins:
      - name: rate-limiting
        config:
          second: 20
          minute: 120
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  ##################################
  # GoTrue credential endpoints: strict per-IP limits against brute force and
  # signup / email spam (OGNA_AUTH_RATE_LIMIT_MINUTE / _HOUR). Longer paths win
  # over /auth in Kong's router, so these take precedence.
  ##################################
  - name: gotrue-token-service
    url: http://gotrue:9999/token
    routes:
      - name: gotrue-token-route
        paths:
          - /auth/token
    plugins:
      - name: rate-limiting
        config:
          minute: ${OGNA_AUTH_RATE_LIMIT_MINUTE}
          hour: ${OGNA_AUTH_RATE_LIMIT_HOUR}
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  - name: gotrue-signup-service
    url: http://gotrue:9999/signup
    routes:
      - name: gotrue-signup-route
        paths:
          - /auth/signup
    plugins:
      - name: rate-limiting
        config:
          minute: ${OGNA_AUTH_RATE_LIMIT_MINUTE}
          hour: ${OGNA_AUTH_RATE_LIMIT_HOUR}
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  - name: gotrue-recover-service
    url: http://gotrue:9999/recover
    routes:
      - name: gotrue-recover-route
        paths:
          - /auth/recover
    plugins:
      - name: rate-limiting
        config:
          minute: ${OGNA_AUTH_RATE_LIMIT_MINUTE}
          hour: ${OGNA_AUTH_RATE_LIMIT_HOUR}
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  - name: gotrue-otp-service
    url: http://gotrue:9999/otp
    routes:
      - name: gotrue-otp-route
        paths:
          - /auth/otp
    plugins:
      - name: rate-limiting
        config:
          minute: ${OGNA_AUTH_RATE_LIMIT_MINUTE}
          hour: ${OGNA_AUTH_RATE_LIMIT_HOUR}
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  - name: gotrue-magiclink-service
    url: http://gotrue:9999/magiclink
    routes:
      - name: gotrue-magiclink-route
        paths:
          - /auth/magiclink
    plugins:
      - name: rate-limiting
        config:
          minute: ${OGNA_AUTH_RATE_LIMIT_MINUTE}
          hour: ${OGNA_AUTH_RATE_LIMIT_HOUR}
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
          size_unit: megabytes

  ##################################
  # Dashboard (PUBLIC)
  ##################################
  - name: dashboard
    url: http://dashboard:3000
    routes:
      - name: dashboard-route
        paths:
          - /

  ##################################
  # API SERVICE
  ##################################
  - name: api-service
    url: http://api:8000
    routes:
      - name: api-route
        paths:
          - /api
    plugins:
      - name: jwt
        config:
          key_claim_name: aud
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          second: 500
          minute: 1000
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
          size_unit: megabytes

  ##################################
  # STORAGE SERVICE
  ##################################
  - name: storage-service
    url: http://storage:8000
    routes:
      - name: storage-route
        paths:
          - /storage
    plugins:
      - name: jwt
        config:
          key_claim_name: aud
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          second: 500
          minute: 1000
          policy: local
          hide_client_headers: true

  ##################################
  # HASURA (GRAPHQL)
  ##################################
  - name: hasura
    url: http://hasura:8080/v1/graphql
    routes:
      - name: graphql
        paths:
          - /graphql
    plugins:
      - name: jwt
        config:
          key_claim_name: aud
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          second: 200
          minute: 1000
          policy: local
          hide_client_headers: true
      - name: request-size-limiting
        config:
          allowed_payload_size: 5
          size_unit: megabytes

############################
# GLOBAL PLUGINS
############################

plugins:
  ##################################
  # CORS
  ##################################
  - name: cors
    config:
      # Rendered from OGNA_CORS_ORIGINS (comma-separated) by the entrypoint
      origins: ${OGNA_CORS_ORIGINS}
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true

  ##################################
  # SECURITY GUARD (header stripping, claim forwarding, security headers)
  ##################################
  - name: ogna-guard
    config:
      jwt_secret: ${GOTRUE_JWT_SECRET}
      db_host: postgres
      db_port: 5432
      db_name: ${POSTGRES_DB}
      db_user: ogna_gateway
      db_password: ${OGNA_GATEWAY_DB_PASSWORD}
      session_cache_ttl: 5
      revoked_cache_ttl: 300
